<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Satisfy&family=Sorts+Mill+Goudy:ital@0;1&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>Project 4</title>
  </head>
  <body>
    <div class="container">
      <div class="divImg">
        <img src="./images/Coffee.png" alt="Coffee Mug" />
      </div>
      <div class="formDiv">
        <form>
          <h1>קפה טוב לבוקר טוב</h1>
          <br />
          <p>
            לקבלת קופון לקפה חינם ומפנק שיפתח לכם את היום בחיוך, יש למלא את
            הפרטים:
          </p>
          <br /><br />
          <div>
            <label for="name">שם מלא:</label><br />
            <input type="text" id="name" name="name" />
          </div>
          <div>
            <label for="email">דוא"ל:</label><br />
            <input type="email" id="email" name="email" />
          </div>

          <br />
          <button type="submit">שליחה</button>
        </form>
      </div>
    </div>
  </body>
</html>
