<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Satisfy&family=Sorts+Mill+Goudy:ital@0;1&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="divForm">
        <h1>Here & Now</h1>
        <p>רצינו להזמין אתכם להנות משלל מתנות</p>
        <p class="smallP">
          לורם איפסום דולור סיט אמט, קונסקטורר אדיפיסינג אלית לפרומי בלוף קינץ
          תתיח לרעח. לת צשחמי צש בליא, מנסוטו צמלח לביקו ננבי, צמוקו בלוקריה.
        </p>
        <div class="divInput">
          <form>
            <label for="name">שם מלא:</label>
            <input type="text" id="name" name="name" />
            <label for="email">דוא"ל:</label>
            <input type="email" id="email" name="email" />
            <button type="submit">עדכן אותי</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
